<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Pangolin">
<link rel='stylesheet' href='index.css'>
<script src='index.js'></script>
</head>

<meta name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta charset="UTF-8">
  
<div class='app-shell'>
  <div class='board-panel'>
    <table>
      <tr>
        <td id='t1' onclick='tdclick("t1");'><div class='con'><center><div class='header'>Agony Uncle</div><br class='hide'><div class='emoji' id='uncle'>👴</div></center></div></td>
        <td id='t2' onclick='tdclick("t2");'><div class='con'><center><div class='header'>Queen of Clubs</div><div class='icon'>♣️</div></center></div></td>
        <td id='t3' onclick='tdclick("t3");'><div class='con'><center><div class='header'>Last Trick</div><div class='icon'>Ω</div></center></div></td>
      <tr>
        <td id='t4' onclick='tdclick("t4");'><div class='con'><center><div class='header'>Queen of Hearts</div><div class='icon'><font color = 'red'>♥️</font></div></center></div></td>
        <td id='t5' onclick='tdclick("t5");'><div class='con'><center><div class='header'>Agony Aunt</div><br class='hide'><div class='emoji' id='aunt'>👵</div></center></div></td>
        <td id='t6' onclick='tdclick("t6");'><div class='con'><center><div class='header'>Queen of Diamonds</div><div class='icon'><font color='red'>♦️</font></div></center></div></td>
      <tr>
        <td id='t7' onclick='tdclick("t7");'><div class='con'><center><div class='header'>Most Tricks</div><div class='icon'>></d></center></div></td>
        <td id='t8' onclick='tdclick("t8");'><div class='con'><center><div class='header'>Queen of Spades</div><div class='icon'>♠️</dnv></center></div></td>
        <td id='t9' onclick='tdclick("t9");'><div class='con'><center><div class='header'>Dumpth Trick</div><div class='icon' id='dumpth'>#</div></center></div></td>
    </table>
  </div>

  <aside class='scores' aria-label='Game controls'>
    <div class='toolbar'>
      <button onclick='clearBoard();'>Clear Board</button>
      <button onclick='makeDump();'>Randomize</button>
      <button id='trickCount' onclick='advanceTrick();'>Trick Number: 1</button>
    </div>

    <div class='player-group'>
      <div class='player-row'>
        <label for='blueScore'>Blue Player</label>
        <button class='score-adjust' onclick='adjustScore("blue", -1)'>−</button>
        <input type='number' class='score' id='blueScore' min='0' max='17' value='17'>
        <button class='score-adjust' onclick='adjustScore("blue", 1)'>+</button>
        <button onclick='noTrick("blue")'>All/None</button>
        <button onclick='noPenalty("blue")'>No Penalties</button>
      </div>

      <div class='player-row'>
        <label for='redScore'>Red Player</label>
        <button class='score-adjust' onclick='adjustScore("red", -1)'>−</button>
        <input type='number' class='score' id='redScore' min='0' max='17' value='17'>
        <button class='score-adjust' onclick='adjustScore("red", 1)'>+</button>
        <button onclick='noTrick("red")'>All/None</button>
        <button onclick='noPenalty("red")'>No Penalties</button>
      </div>

      <div class='player-row'>
        <label for='greenScore'>Green Player</label>
        <button class='score-adjust' onclick='adjustScore("green", -1)'>−</button>
        <input type='number' id='greenScore' class='score' min='0' max='17' value='17'>
        <button class='score-adjust' onclick='adjustScore("green", 1)'>+</button>
        <button onclick='noTrick("green")'>All/None</button>
        <button onclick='noPenalty("green")'>No Penalties</button>
      </div>

      <div class='player-row'>
        <label for='purpleScore'>Purple Player</label>
        <button class='score-adjust' onclick='adjustScore("purple", -1)'>−</button>
        <input type='number' id='purpleScore' class='score' min='0' max='17' value='17'>
        <button class='score-adjust' onclick='adjustScore("purple", 1)'>+</button>
        <button onclick='noTrick("purple")'>All/None</button>
        <button onclick='noPenalty("purple")'>No Penalties</button>
      </div>
    </div>
  </aside>
</div>
